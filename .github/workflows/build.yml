name: Build ScreenOcr

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # push tag v1.0.0, v1.0.1... => tạo Release kèm file zip
  pull_request:
  workflow_dispatch:      # cho phép bấm "Run workflow" thủ công trên GitHub

permissions:
  contents: write         # cần để tạo Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $v = "1.0.0"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: dotnet test tests/ScreenOcr.Tests/ScreenOcr.Tests.csproj -c Release

      - name: Build (Release)
        run: dotnet build ScreenOcr.csproj -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = "bin/Release/net48"
          # App chạy 64-bit: bỏ bản native x86 của Tesseract cho nhẹ
          Remove-Item "$out/x86" -Recurse -Force -ErrorAction SilentlyContinue
          # Tesseract cần Visual C++ runtime: copy kèm (app-local) để máy chưa cài VC++ Redistributable vẫn chạy
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" "$out/x64/" -Force
          }
          if (-not (Test-Path "$out/tessdata/eng.traineddata")) { throw "Thiếu tessdata/eng.traineddata" }
          Copy-Item README.md $out/ -Force
          Compress-Archive -Path "bin/Release/net48/*" -DestinationPath "dist/ScreenOcr-${{ steps.ver.outputs.version }}.zip" -Force
          Get-ChildItem bin/Release/net48

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ScreenOcr-${{ steps.ver.outputs.version }}
          path: bin/Release/net48/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
